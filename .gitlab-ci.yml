stages: [plato-build-test]

trigger-super:
  stage: plato-build-test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PARENT_BRANCH: ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        PARENT_BRANCH: ${CI_COMMIT_BRANCH}
  variables:
    PARENT_SOURCE: ${CI_PIPELINE_SOURCE}
    PARENT_MR_IID: ${CI_MERGE_REQUEST_IID}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    PARENT_API_ACCESS_TOKEN: ${PLATOENGINE_API_TOKEN}
  trigger:
    project: 1540-compsim/plato/plato
    strategy: depend
    branch: ralberd/update_spack_packages
  needs: []
